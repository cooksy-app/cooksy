<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cooksy</title>
  <meta name="description" content="Cooksy: find recipes you can safely cook, filtered for your allergies and matched to what's in your kitchen.">
  <meta name="theme-color" content="#24332d">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- iPhone / iPad: "Add to Home Screen" from Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cooksy">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Official HADZZ STUDIOS loading screen. Scales to laptop, tablet and phone. -->
  <div class="splash" id="splash" role="status" aria-live="polite">
    <div class="splash__inner">
      <h1 class="splash__title">HADZZ STUDIOS</h1>
      <p class="splash__status">loading...</p>
      <svg class="splash__star" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 1.8 3 6.4 7 .8-5.2 4.8 1.4 6.9L12 17.2l-6.2 3.5 1.4-6.9L2 9l7-.8z"/></svg>
    </div>
  </div>

  <div id="root"></div>
  <noscript><p style="padding:24px">Cooksy needs JavaScript to run.</p></noscript>

  <!-- Data (swap for a backend/API later; see README) -->
  <script src="js/data/countries.js"></script>
  <script src="js/data/cuisines.js"></script>
  <script src="js/data/allergens.js"></script>
  <script src="js/data/ingredients.js"></script>
  <script src="js/data/recipes.js"></script>
  <!-- Core logic -->
  <script src="js/config.js"></script>
  <script src="js/vendor/supabase.js"></script>
  <script src="js/core/util.js"></script>
  <script src="js/core/store.js"></script>
  <script src="js/core/safety.js"></script>
  <script src="js/core/kitchen.js"></script>
  <script src="js/core/catalog.js"></script>
  <script src="js/core/auth.js"></script>
  <!-- UI -->
  <script src="js/ui/components.js"></script>
  <script src="js/views/shared.js"></script>
  <script src="js/views/account.js"></script>
  <script src="js/views/onboarding.js"></script>
  <script src="js/views/home.js"></script>
  <script src="js/views/explore.js"></script>
  <script src="js/views/cuisines.js"></script>
  <script src="js/views/recipe.js"></script>
  <script src="js/views/kitchen.js"></script>
  <script src="js/views/shopping.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
